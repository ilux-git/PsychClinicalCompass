name: MVP checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres-test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres-test
      COMPASS_DATABASE_URL: postgresql+asyncpg://postgres:postgres-test@127.0.0.1:5432/compass_test
      MIGRATION_DATABASE_URL: postgresql+asyncpg://postgres:postgres-test@127.0.0.1:5432/compass_migration_test
      MIS_DATABASE_URL: postgresql+asyncpg://mis_reader:mis_readonly@127.0.0.1:5432/mis
      REDIS_URL: redis://127.0.0.1:6379/0
      JWT_SECRET: ci-only-synthetic-test-secret-123456789
      TELEGRAM_ENABLED: 'false'
      ALLOW_TEST_DB_RESET: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Prepare disposable PostgreSQL databases and SELECT-only MIS role
        run: |
          psql -h 127.0.0.1 -U postgres -c 'CREATE DATABASE compass_test'
          psql -h 127.0.0.1 -U postgres -c 'CREATE DATABASE compass_migration_test'
          psql -h 127.0.0.1 -U postgres -c 'CREATE DATABASE mis'
          psql -h 127.0.0.1 -U postgres -d mis -v ON_ERROR_STOP=1 -f docker/db_mis/init.sql
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: compass-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create isolated demo configuration
        run: |
          python - <<'PY'
          from pathlib import Path
          import secrets
          Path('.env').write_text(Path('.env.example').read_text().replace(
              'JWT_SECRET=change-me-in-production','JWT_SECRET='+secrets.token_urlsafe(48)))
          PY
      - run: docker compose up --build -d
      - name: Wait for initialized app and verify two roles
        run: |
          python - <<'PY'
          import json, time, urllib.request
          for attempt in range(90):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3) as r:
                      assert json.load(r)['status'] == 'ok'
                  break
              except Exception:
                  time.sleep(2)
          else:
              raise RuntimeError('Compose demo never became healthy')
          def login(username, password):
              request = urllib.request.Request('http://127.0.0.1:8000/auth/login',
                  data=json.dumps(dict(username=username,password=password)).encode(),
                  headers={'Content-Type':'application/json'})
              with urllib.request.urlopen(request) as r:
                  return json.load(r)['access_token']
          def get(path, token):
              request = urllib.request.Request('http://127.0.0.1:8000'+path,
                  headers={'Authorization':'Bearer '+token})
              with urllib.request.urlopen(request) as r:
                  return json.load(r)
          doctor = login('doctor','doctor-pass-123')
          patient = login('patient6','patient-pass-123')
          assert len(get('/patients',doctor)) == 8
          assert len(get('/patients',patient)) == 1
          assert get('/participation/me',patient)['commercial_rewards_enabled'] is False
          with urllib.request.urlopen('http://127.0.0.1:8000/') as r:
              assert '<div id="root">' in r.read().decode()
          print('Compose UI, migrations, seed, login and two-role scope passed')
          PY
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
